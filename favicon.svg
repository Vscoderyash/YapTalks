<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="YapTalks">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea37f"/>
      <stop offset="100%" stop-color="#0f6ee9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#brand)"/>
  <text x="32" y="44" text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif"
        font-weight="800" font-size="28" fill="#ffffff" filter="url(#glow)">YT</text>
</svg>
